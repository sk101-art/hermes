reference_dir: "reference"

# Path safety boundary for project scanning. Explicit allow-list of root
# directories that user-supplied project paths may reside in. Empty list means
# "use defaults" (repository root, current working directory, OS temp dir).
# Override at runtime with the HERMES_ALLOWED_PROJECT_ROOTS environment
# variable (os.pathsep-separated paths).
allowed_project_roots: []
max_file_size_kb: 512
max_total_project_mb: 25
max_match_candidates: 100
recency_days: 90

relevance_weights:
  semantic_similarity: 0.45
  dependency_overlap: 0.20
  technology_overlap: 0.15
  language_overlap: 0.10
  topic_overlap: 0.10

impact_weights:
  relevance: 0.35
  verification: 0.20
  maturity: 0.15
  novelty: 0.15
  dependency_directness: 0.15
