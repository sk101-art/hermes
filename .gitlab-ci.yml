# HERMES GitLab CI Pipeline
# Enforces mandatory closure gates across repository integrity, database immutability,
# contrast contracts, backend unit/integration tests, frontend tests/builds, and Playwright E2E.

stages:
  - integrity
  - test
  - summary

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "v1"'
    - if: '$CI_COMMIT_BRANCH == "v1"'
    - if: '$CI_COMMIT_BRANCH == "main"'

variables:
  CI: "true"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

default:
  interruptible: true

# -----------------------------------------------------------------------------
# 1. Repository Integrity & Base Checksum
# -----------------------------------------------------------------------------
repository_integrity:
  stage: integrity
  image: python:3.11-slim
  allow_failure: false
  script:
    - echo "Verifying repository integrity at commit $CI_COMMIT_SHA on branch $CI_COMMIT_REF_NAME"
    - test -f data/tech_intel.db || (echo "FATAL: data/tech_intel.db missing!" && exit 1)
    - test -f frontend/package.json || (echo "FATAL: frontend/package.json missing!" && exit 1)
    - test -f app/api/server.py || (echo "FATAL: app/api/server.py missing!" && exit 1)
    - test -f tests/test_e2e_playwright.py || (echo "FATAL: tests/test_e2e_playwright.py missing!" && exit 1)
    - sha256sum data/tech_intel.db > db-before.sha256
    - echo "Base DB SHA256:"
    - cat db-before.sha256
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - db-before.sha256

# -----------------------------------------------------------------------------
# 2. Database Immutability & Authoritative Table Counts
# -----------------------------------------------------------------------------
db_immutability:
  stage: integrity
  image: python:3.11-slim
  allow_failure: false
  script:
    - |
      python -c "
      import sqlite3, sys

      expected_counts = {
          'events': 368,
          'story_clusters': 345,
          'claims': 360,
          'evidence': 416,
          'technology_assessments': 345,
          'projects': 2,
          'inbox_items': 322,
          'saved_items': 2,
          'daily_briefings': 1,
          'source_checkpoints': 9,
          'runtime_jobs': 10,
          'intelligence_changes': 0
      }

      conn = sqlite3.connect('data/tech_intel.db')
      cursor = conn.cursor()

      report = []
      report.append('# Authoritative Database Row Counts\n')
      report.append('| Table | Expected | Actual | Status |')
      report.append('|---|---|---|---|')

      errors = []
      for table, expected in expected_counts.items():
          actual = cursor.execute(f'SELECT COUNT(*) FROM {table}').fetchone()[0]
          status = 'MATCH' if actual == expected else 'MISMATCH'
          report.append(f'| {table} | {expected} | {actual} | {status} |')
          if actual != expected:
              errors.append(f'Table {table} count mismatch: expected {expected}, got {actual}')

      with open('db_row_counts.md', 'w') as f:
          f.write('\n'.join(report))

      print('\n'.join(report))
      if errors:
          print('FATAL ERRORS:\n' + '\n'.join(errors))
          sys.exit(1)
      "
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - db_row_counts.md

# -----------------------------------------------------------------------------
# 3. Backend Unit & Integration Tests (304 Tests)
# -----------------------------------------------------------------------------
backend_tests:
  stage: test
  image: python:3.11-slim
  allow_failure: false
  before_script:
    - mkdir -p reports
    - pip install -r requirements.txt
  script:
    - python -m pytest tests/ --ignore=tests/test_e2e_playwright.py --ignore=tests/test_contrast_contract.py -v --junitxml=reports/backend.xml
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/backend.xml
    reports:
      junit: reports/backend.xml

# -----------------------------------------------------------------------------
# 4. Contrast & Accessibility Static Contract Tests (96 Tests)
# -----------------------------------------------------------------------------
contrast_contract:
  stage: test
  image: python:3.11-slim
  allow_failure: false
  before_script:
    - mkdir -p reports
    - pip install -r requirements.txt
  script:
    - python -m pytest tests/test_contrast_contract.py -v --junitxml=reports/contrast.xml
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/contrast.xml
    reports:
      junit: reports/contrast.xml

# -----------------------------------------------------------------------------
# 5. Frontend Unit Tests & Production Build (222 Tests)
# -----------------------------------------------------------------------------
frontend_tests_and_build:
  stage: test
  image: node:20-slim
  allow_failure: false
  cache:
    key: "$CI_COMMIT_REF_SLUG-npm"
    paths:
      - .npm/
  script:
    - cd frontend
    - npm ci --cache "$CI_PROJECT_DIR/.npm"
    - npm test
    - npm run build
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - frontend/dist/

# -----------------------------------------------------------------------------
# 6. Playwright E2E Integration Suite (11 Tests)
# -----------------------------------------------------------------------------
playwright_e2e:
  stage: test
  image: mcr.microsoft.com/playwright/python:v1.58.0-jammy
  allow_failure: false
  before_script:
    - mkdir -p reports tests/e2e_screenshots
    - apt-get update && apt-get install -y curl
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - pip install -r requirements.txt
    - cd frontend && npm ci && cd ..
  script:
    - python -m pytest tests/test_e2e_playwright.py -v --junitxml=reports/e2e.xml
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/e2e.xml
      - tests/e2e_screenshots/
    reports:
      junit: reports/e2e.xml

# -----------------------------------------------------------------------------
# 7. Final Consolidated Evidence Summary
# -----------------------------------------------------------------------------
evidence_summary:
  stage: summary
  image: python:3.11-slim
  allow_failure: false
  needs:
    - repository_integrity
    - db_immutability
    - backend_tests
    - contrast_contract
    - frontend_tests_and_build
    - playwright_e2e
  script:
    - sha256sum data/tech_intel.db > db-after.sha256
    - diff -u db-before.sha256 db-after.sha256 || (echo "FATAL: Production database was modified during pipeline!" && exit 1)
    - echo "Production DB Checksum match verified:"
    - cat db-after.sha256
    - |
      python -c "
      import os
      with open('pipeline_evidence_summary.md', 'w') as f:
          f.write('# HERMES Phase 15 CI Closure Report\n\n')
          f.write('All mandatory automated quality and accessibility gates passed cleanly.\n\n')
          f.write('### Verified Gates:\n')
          f.write('- Repository Integrity: PASSED\n')
          f.write('- Database Immutability (Checksum & 12 Table Counts): PASSED\n')
          f.write('- Backend Suite (304 tests): PASSED\n')
          f.write('- Contrast & Static Contracts (96 tests): PASSED\n')
          f.write('- Frontend Unit Suite (222 tests) & Vite Build: PASSED\n')
          f.write('- Playwright E2E Suite (11 tests): PASSED\n')
          f.write('- Production DB Immutability: VERIFIED (Zero Byte Drift)\n')
      "
    - cat pipeline_evidence_summary.md
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - db-before.sha256
      - db-after.sha256
      - pipeline_evidence_summary.md
