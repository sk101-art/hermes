# HERMES GitLab CI Pipeline
# Enforces mandatory closure gates across repository integrity, intra-job database immutability,
# contrast contracts, backend unit/integration tests, frontend tests/builds, and Playwright E2E.

stages:
  - integrity
  - test
  - summary

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "v1"'
    - if: '$CI_COMMIT_BRANCH == "v1"'
    - if: '$CI_COMMIT_BRANCH == "main"'

variables:
  CI: "true"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

default:
  interruptible: true

# -----------------------------------------------------------------------------
# 1. Repository Integrity & Base Checksum
# -----------------------------------------------------------------------------
repository_integrity:
  stage: integrity
  image: python:3.11-slim
  allow_failure: false
  script:
    - mkdir -p reports
    - 'echo "Verifying repository integrity at commit $CI_COMMIT_SHA on branch $CI_COMMIT_REF_NAME"'
    - 'test -f data/tech_intel.db || exit 1'
    - 'test -f frontend/package.json || exit 1'
    - 'test -f app/api/server.py || exit 1'
    - 'test -f tests/test_e2e_playwright.py || exit 1'
    - 'sha256sum data/tech_intel.db > reports/db-repo-base.sha256'
    - 'echo "Base DB SHA256:"'
    - 'cat reports/db-repo-base.sha256'
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/db-repo-base.sha256

# -----------------------------------------------------------------------------
# 2. Database Immutability & Authoritative Table Counts
# -----------------------------------------------------------------------------
db_immutability:
  stage: integrity
  image: python:3.11-slim
  allow_failure: false
  script:
    - mkdir -p reports
    - python scripts/verify_db_counts.py data/tech_intel.db reports/db_row_counts.md
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/db_row_counts.md

# -----------------------------------------------------------------------------
# 3. Backend Unit & Integration Tests (Exact 325 Tests)
# -----------------------------------------------------------------------------
backend_tests:
  stage: test
  image: python:3.11-slim
  allow_failure: false
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - mkdir -p reports
    - pip install -r requirements.txt
  script:
    - sha256sum data/tech_intel.db > reports/db-before-backend.sha256
    - python -m pytest tests/ --ignore=tests/test_e2e_playwright.py --ignore=tests/test_contrast_contract.py -v --junitxml=reports/backend.xml
    - sha256sum data/tech_intel.db > reports/db-after-backend.sha256
    - diff -u reports/db-before-backend.sha256 reports/db-after-backend.sha256 || exit 1
    - git diff --exit-code -- data/tech_intel.db
    - python scripts/verify_ci_counts.py reports/backend.xml 325 "Backend Suite"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/backend.xml
      - reports/db-before-backend.sha256
      - reports/db-after-backend.sha256
    reports:
      junit: reports/backend.xml

# -----------------------------------------------------------------------------
# 4. Contrast & Accessibility Static Contract Tests (Exact 96 Tests)
# -----------------------------------------------------------------------------
contrast_contract:
  stage: test
  image: python:3.11-slim
  allow_failure: false
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - mkdir -p reports
    - pip install -r requirements.txt
  script:
    - sha256sum data/tech_intel.db > reports/db-before-contrast.sha256
    - python -m pytest tests/test_contrast_contract.py -v --junitxml=reports/contrast.xml
    - sha256sum data/tech_intel.db > reports/db-after-contrast.sha256
    - diff -u reports/db-before-contrast.sha256 reports/db-after-contrast.sha256 || exit 1
    - git diff --exit-code -- data/tech_intel.db
    - python scripts/verify_ci_counts.py reports/contrast.xml 96 "Contrast Contract Suite"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/contrast.xml
      - reports/db-before-contrast.sha256
      - reports/db-after-contrast.sha256
    reports:
      junit: reports/contrast.xml

# -----------------------------------------------------------------------------
# 5. Frontend Unit Tests & Production Build (Exact 230 Tests)
# -----------------------------------------------------------------------------
frontend_tests_and_build:
  stage: test
  image: node:20-slim
  allow_failure: false
  cache:
    key: "$CI_COMMIT_REF_SLUG-npm"
    paths:
      - .npm/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3 bash
    - mkdir -p reports
  script:
    - cd frontend
    - npm ci --cache "$CI_PROJECT_DIR/.npm"
    - bash -o pipefail -c 'npm test 2>&1 | tee ../reports/frontend.log'
    - npm run build
    - cd ..
    - python3 scripts/verify_frontend_counts.py reports/frontend.log 230
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - frontend/dist/
      - reports/frontend.log

# -----------------------------------------------------------------------------
# 6. Playwright E2E Integration Suite (Exact 15 Tests)
# -----------------------------------------------------------------------------
playwright_e2e:
  stage: test
  image: mcr.microsoft.com/playwright/python:v1.40.0-jammy
  allow_failure: false
  before_script:
    - mkdir -p reports tests/e2e_screenshots
    - apt-get update && apt-get install -y --no-install-recommends curl git
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y --no-install-recommends nodejs
    - pip install -r requirements.txt
    - playwright install --with-deps chromium
    - cd frontend && npm ci && cd ..
  script:
    - sha256sum data/tech_intel.db > reports/db-before-e2e.sha256
    - python -m pytest tests/test_e2e_playwright.py -v --junitxml=reports/e2e.xml
    - sha256sum data/tech_intel.db > reports/db-after-e2e.sha256
    - diff -u reports/db-before-e2e.sha256 reports/db-after-e2e.sha256 || exit 1
    - git diff --exit-code -- data/tech_intel.db
    - python scripts/verify_ci_counts.py reports/e2e.xml 15 "Playwright E2E Suite"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/e2e.xml
      - reports/db-before-e2e.sha256
      - reports/db-after-e2e.sha256
      - tests/e2e_screenshots/
    reports:
      junit: reports/e2e.xml

# -----------------------------------------------------------------------------
# 7. Final Consolidated Evidence Summary & Cross-Job Proof
# -----------------------------------------------------------------------------
evidence_summary:
  stage: summary
  image: python:3.11-slim
  allow_failure: false
  needs:
    - repository_integrity
    - db_immutability
    - backend_tests
    - contrast_contract
    - frontend_tests_and_build
    - playwright_e2e
  script:
    - 'echo "Verifying intra-job checksum proofs from all test jobs..."'
    - diff -u reports/db-before-backend.sha256 reports/db-after-backend.sha256 || exit 1
    - diff -u reports/db-before-contrast.sha256 reports/db-after-contrast.sha256 || exit 1
    - diff -u reports/db-before-e2e.sha256 reports/db-after-e2e.sha256 || exit 1
    - diff -u reports/db-repo-base.sha256 reports/db-before-backend.sha256 || exit 1
    - diff -u reports/db-repo-base.sha256 reports/db-before-contrast.sha256 || exit 1
    - diff -u reports/db-repo-base.sha256 reports/db-before-e2e.sha256 || exit 1
    - python scripts/verify_ci_counts.py reports/backend.xml 325 "Backend Suite (Post-Verification)"
    - python scripts/verify_ci_counts.py reports/contrast.xml 96 "Contrast Contract Suite (Post-Verification)"
    - python scripts/verify_ci_counts.py reports/e2e.xml 15 "Playwright E2E Suite (Post-Verification)"
    - python scripts/verify_frontend_counts.py reports/frontend.log 230
    - >-
      python -c "open('reports/pipeline_evidence_summary.md', 'w').write('# HERMES Phase 16 Carry-Forward CI Verification Report\n\nAll mandatory automated quality and accessibility gates passed cleanly.\n\n### Verified Gates:\n- Repository Integrity & Baseline Checksum: PASSED\n- Authoritative Table Counts (12 tables): PASSED\n- Backend Suite (exact 325 tests): PASSED\n- Backend Intra-Job DB Immutability: VERIFIED (Zero Drift)\n- Contrast & Static Contracts (exact 96 tests): PASSED\n- Contrast Intra-Job DB Immutability: VERIFIED (Zero Drift)\n- Frontend Unit Suite (exact 230 tests) & Vite Build: PASSED\n- Playwright E2E Suite (exact 15 tests): PASSED\n- Playwright Intra-Job DB Immutability: VERIFIED (Zero Drift)\n- Complete Cross-Job Checksum Parity: VERIFIED across Base, Backend, Contrast, and E2E\n')"
    - cat reports/pipeline_evidence_summary.md
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/
